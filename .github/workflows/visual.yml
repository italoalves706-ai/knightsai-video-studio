name: Render KnightsAI V3 Visual
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          npm install
          python -m pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Narration
        run: python scripts/narrate.py
      - name: Search and download reusable visuals
        run: python scripts/find_visuals.py
      - name: Render
        run: npx remotion render src/index-visual.ts KnightsAIVisual out/gta6-visual.mp4 --codec h264 --crf 24 --concurrency 2
      - uses: actions/upload-artifact@v4
        with:
          name: knightsai-v3-video-and-credits
          path: |
            out/gta6-visual.mp4
            out/visual-credits.json
          retention-days: 7
