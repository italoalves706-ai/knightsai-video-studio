name: Render KnightsAI V4 Motion Pilot
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          npm install
          python -m pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Narration and timings
        run: python scripts/narrate-pilot.py
      - name: Render motion graphics pilot
        run: npx remotion render src/index-pilot.ts KnightsAIPilot out/gta6-v4-pilot.mp4 --codec h264 --crf 22 --concurrency 2
      - uses: actions/upload-artifact@v4
        with:
          name: knightsai-v4-pilot
          path: out/gta6-v4-pilot.mp4
          retention-days: 7
