
name: Render KnightsAI Demo

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npx remotion render src/index.ts KnightsAI out/video.mp4

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: knightsai-demo-video
          path: out/video.mp4
