name: Render KnightsAI V4 Dual Format
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          npm install
          python -m pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: python scripts/narrate-pilot.py
      - name: Render YouTube 16:9
        run: npx remotion render src/index-pilot.ts KnightsAIPilotWide out/gta6-youtube-16x9.mp4 --codec h264 --crf 22 --concurrency 2
      - name: Render Shorts 9:16
        run: npx remotion render src/index-pilot.ts KnightsAIPilot out/gta6-shorts-9x16.mp4 --codec h264 --crf 22 --concurrency 2
      - uses: actions/upload-artifact@v4
        with:
          name: knightsai-dual-format
          path: out/*.mp4
          retention-days: 7
